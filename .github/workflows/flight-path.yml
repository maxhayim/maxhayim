name: Generate Flight Path and Cockpit Telemetry

on:
  schedule:
    - cron: "0 */12 * * *"   # every 12 hours
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: maxhayim/flight-path-radar@v1
        with:
          github_user_name: maxhayim
          outputs: |
            dist/flight-path.svg?plane=b2&theme=cockpit

      - uses: maxhayim/cockpit-telemetry@v1
        with:
          github_user_name: maxhayim
          timezone: America/New_York
          outputs: dist/cockpit-telemetry.svg

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
