name: Generate Flight Path, Cockpit Telemetry and Systems Console

on:
  schedule:
    - cron: "0 */12 * * *"   # every 12 hours
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: maxhayim/flight-path-radar@v1
        with:
          github_user_name: maxhayim
          outputs: |
            dist/flight-path.svg?plane=b2&theme=cockpit&titles=false

      - uses: maxhayim/cockpit-telemetry@v1
        with:
          github_user_name: maxhayim
          timezone: America/New_York
          header: false
          outputs: dist/cockpit-telemetry.svg

      - uses: maxhayim/systems-console@v1
        with:
          github_user_name: maxhayim
          titles: false
          systems: |
            Platforms: github, ubuntu, linux, raspberrypi, arduino
            Infra / Deployment: docker, nginx, git, github, cloudflare
          outputs: dist/systems-console.svg

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
