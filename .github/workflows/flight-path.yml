name: Generate Flight Path, Cockpit Telemetry, Systems Console and Open Comms Radio

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub's fastest), keeps the visitor log fresh
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: maxhayim/flight-path-radar@v1
        with:
          github_user_name: maxhayim
          outputs: |
            dist/flight-path.svg?plane=b2&theme=cockpit&titles=false

      - uses: maxhayim/cockpit-telemetry@v1
        with:
          github_user_name: maxhayim
          timezone: America/New_York
          header: false
          outputs: dist/cockpit-telemetry.svg

      - uses: maxhayim/systems-console@v1
        with:
          github_user_name: maxhayim
          titles: false
          systems: |
            Platforms: github, ubuntu, linux, raspberrypi, arduino
            Infra / Deployment: docker, nginx, git, github, cloudflare
          outputs: dist/systems-console.svg

      - uses: maxhayim/open-comms-radio@v1
        with:
          github_user_name: maxhayim
          email: maxhayim@users.noreply.github.com
          status: SYSTEMS NOMINAL · READY FOR NEXT MISSION
          github_status: true
          visitor_page_id: maxhayim.maxhayim
          titles: false
          outputs: |
            dist/open-comms-radio.svg?part=radio
            dist/open-comms-status.svg?part=status

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
